<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
    <head>
        <title>Login - Runner One</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />

        <link rel="stylesheet" href="login.css" />
    </head>

    <body>
        <header class="header-login"></header>

        <main>
            <div class="row">
                <!-- Imagem -->
                <div class="col-md-6">
                    <img
                        src="imagens/loginrunnerone.jpeg"
                        alt="Runner One"
                        class="img-fluid"
                    />
                </div>

                <!-- Formulário -->
                <div class="col-md-6 d-flex align-items-center min-vh-100 justify-content-center">
                    <form class="formulario-login" id="loginForm">

                        <div class="mb-3">
                            <h1 class="h1">Bem-vindo de volta!</h1>
                            <br />
                            <h2 class="h2">
                                Faça login para acessar o sistema Runner One.
                            </h2>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Digite seu usuário"
                                id="username"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Digite sua senha"
                                id="password"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <a href="#">Esqueci minha senha</a>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Entrar
                        </button>

                    </form>
                </div>
            </div>
        </main>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwxH9j09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
